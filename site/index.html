<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Codex · World Without God</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="loading">
  <!-- Top bar -->
  <header class="topbar">
    <button id="sidebarToggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
    <a class="brand" href="#/">
      <span class="brand-mark">🕯️</span>
      <span class="brand-text">The Codex<small>World Without God</small></span>
    </a>
    <button id="searchOpen" class="search-trigger" title="Search (Ctrl+K)">
      <span>🔍</span><span class="st-label">Search everything…</span><kbd>Ctrl K</kbd>
    </button>
    <div class="topbar-right">
      <button id="assistantToggle" class="icon-btn accent" title="Codex Assistant">✦ Assistant</button>
      <button id="themeToggle" class="icon-btn" title="Toggle light / dark">◐</button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <nav id="nav"></nav>
  </aside>

  <!-- Main -->
  <main class="main" id="view"></main>

  <!-- Assistant panel -->
  <aside class="assistant" id="assistant" hidden>
    <div class="assistant-head">
      <strong>✦ Codex Assistant</strong>
      <button class="icon-btn" id="assistantClose" title="Close">✕</button>
    </div>
    <p class="assistant-sub">Your canon, at your fingertips. Type a name to pull everything you've written about it — or keep this open while you write and it recognises names as you go.</p>
    <input id="assistantInput" class="assistant-input" placeholder="Look up a name, place, house…" autocomplete="off">
    <div class="assistant-body" id="assistantBody"></div>
  </aside>

  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-box">
      <input id="searchInput" placeholder="Search characters, houses, places, lore…" autocomplete="off">
      <div class="search-hint">Type to search across everything · <kbd>Esc</kbd> to close</div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</div>

<script src="data/db.js"></script>
<script src="js/app.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
